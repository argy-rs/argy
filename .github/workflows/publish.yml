name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "argy") | .version')
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match argy version ${version}" >&2
            exit 1
          fi

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings -W clippy::pedantic -W clippy::nursery
          cargo test --workspace --all-features
          RUSTDOCFLAGS="-D warnings" \
            cargo doc --no-deps --document-private-items --workspace --all-features

      - name: Publish crates
        shell: bash
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "argy") | .version')

          is_published() {
            curl --fail --silent --show-error \
              --user-agent "argy release workflow" \
              "https://crates.io/api/v1/crates/$1/${version}" >/dev/null
          }

          publish_crate() {
            local crate=$1
            local manifest=$2

            if is_published "${crate}"; then
              echo "${crate} ${version} is already published; skipping"
              return
            fi

            for attempt in {1..12}; do
              echo "Publishing ${crate} ${version} (attempt ${attempt}/12)"
              if cargo publish --manifest-path "${manifest}"; then
                break
              fi
              if is_published "${crate}"; then
                echo "${crate} ${version} became available after the publish attempt"
                return
              fi
              if [[ ${attempt} -eq 12 ]]; then
                echo "Failed to publish ${crate} ${version}" >&2
                return 1
              fi
              sleep 10
            done

            for attempt in {1..30}; do
              if is_published "${crate}"; then
                echo "${crate} ${version} is available from crates.io"
                return
              fi
              echo "Waiting for ${crate} ${version} to reach the registry (${attempt}/30)"
              sleep 10
            done

            echo "Timed out waiting for ${crate} ${version} in crates.io" >&2
            return 1
          }

          publish_crate argy_shared argy_shared/Cargo.toml
          publish_crate argy_derive argy_derive/Cargo.toml
          publish_crate argy_complete argy_complete/Cargo.toml
          publish_crate argy argy/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
